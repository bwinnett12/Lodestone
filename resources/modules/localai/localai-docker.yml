services:
  api:
    # For GPU support, use one of:
    image: localai/localai:latest-aio-gpu-nvidia-cuda-12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 1m
      timeout: 5m
      retries: 5
    ports:
      - 8090:8080
    environment:
      - DEBUG=true
    volumes:
      - /storage/Orchid/shortstack/localai:/storage/Orchid/shortstack/localai/models:cached

    # For NVIDIA GPUs with standalone Docker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]